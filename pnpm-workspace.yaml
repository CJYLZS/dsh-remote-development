# Standalone workspace boundary: pnpm stops its upward workspace search here,
# so the plugin is managed independently of the dsh checkout it lives inside.
packages:
  - .

# Build scripts reviewed (same policy shape as the dsh checkout): esbuild
# powers the tsdown bundle; node-pty + koffi are the native PTY/process
# closure the local subprocess runtime needs. ssh2's native accelerators are
# denied: the build stubs their requires out, so building them here would only
# demand a C++ toolchain from contributors and change nothing in lib/.
allowBuilds:
  '@deepseek-ai/dsh-subprocess-local': true
  cpu-features: false
  esbuild: true
  koffi: true
  node-pty: true
  ssh2: false

minimumReleaseAgeExclude:
  - '@deepseek-ai/dsh-fs-local@0.1.5-alpha.2'
  - '@deepseek-ai/dsh-fs-sandbox@0.1.5-alpha.2'
  - '@deepseek-ai/dsh-fs@0.1.5-alpha.2'
  - '@deepseek-ai/cosmokit@1.8.5'
  - '@deepseek-ai/dsh-agent@0.1.7-alpha.2'
  - '@deepseek-ai/dsh-bash-local@0.1.7-alpha.2'
  - '@deepseek-ai/dsh-bash-sandbox@0.1.7-alpha.2'
  - '@deepseek-ai/dsh-brand@0.1.7-alpha.2'
  - '@deepseek-ai/dsh-client-locale@0.1.7-alpha.2'
  - '@deepseek-ai/dsh-client-ui-input-trigger@0.1.7-alpha.2'
  - '@deepseek-ai/dsh-client-ui-primitives@0.1.7-alpha.2'
  - '@deepseek-ai/dsh-client-ui-renderer@0.1.7-alpha.2'
  - '@deepseek-ai/dsh-client-ui-settings@0.1.7-alpha.2'
  - '@deepseek-ai/dsh-client-ui-slots@0.1.7-alpha.2'
